<div class="mx-auto my-5 bg-black text-white w-25 p-5 shadow">
  <h1 class="text-center">
    <i class="fa-solid fa-user-plus"></i>
  </h1>

<form [formGroup]="theForm" (submit)="submit($event)">

  <label class="form-label">Email</label>
  <input type="email" formControlName="email" class="bg-black text-white border-0 border-bottom form-control" />

  <br />

  <label class="form-label">Password</label>
  <input type="password" formControlName="password" class="bg-black text-white border-0 border-bottom form-control" />

  <br />

  <label class="form-label">First Name</label>
  <input type="text" formControlName="firstName" class="bg-black text-white border-0 border-bottom form-control" />

  <br />

  <label class="form-label">Last Name</label>
  <input type="text" formControlName="lastName" class="bg-black text-white border-0 border-bottom form-control" />

  <br />

  <div class="text-center">
  <button type="submit" class="btn btn-primary">Submit</button>
  </div>
</form>

@if (error()) {
<p class="text-danger">Error registering</p>
}

<div class="row justify-content-between">
<a routerLink="/login" class="col-1">Login</a>
<app-theme-btn class="col-2" />
</div>

</div>
